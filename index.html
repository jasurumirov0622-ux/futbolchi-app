<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONSPORTS.UZ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b1220;--card:#131c30;--line:#22304d;--tx:#eef2fa;--mu:#8a98b5;--ac:#2fd08a;--live:#ff5a5f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:76px}
header{padding:18px 16px 6px;font-size:22px;font-weight:800}
header span{color:var(--ac)}
.chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.chip{border:1px solid var(--line);background:none;color:var(--mu);padding:7px 14px;border-radius:99px;font:inherit;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#052015;font-weight:700}
h3{margin:16px 16px 6px;font-size:14px;color:var(--mu);font-weight:600}
.m{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:8px;background:var(--card);margin:6px 16px;padding:12px;border-radius:14px}
.t{display:flex;align-items:center;gap:8px;min-width:0}
.t.r{justify-content:flex-end;text-align:right}
.t img,.row img{width:22px;height:22px;object-fit:contain;flex:none}
.t b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.c{text-align:center;font-size:18px;font-weight:800}
.c small{display:block;font-size:11px;font-weight:600;color:var(--mu)}
.c.live{color:var(--live)}
.row{display:grid;grid-template-columns:24px 1fr 28px 34px 34px;align-items:center;gap:8px;margin:0 16px;padding:9px 0;border-bottom:1px solid var(--line)}
.row.h{color:var(--mu);font-size:12px}
.row .n{display:flex;align-items:center;gap:8px;min-width:0}
.row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>*:nth-child(n+3){text-align:right}
.empty{text-align:center;color:var(--mu);padding:40px 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0f1729;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:14px;font:600 14px system-ui}
nav button.on{color:var(--ac)}
</style>
</head>
<body>
<header><span>ONSPORTS</span>.UZ</header>
<div id="chips" class="chips"></div>
<main id="out"><div class="empty">Yuklanmoqda…</div></main>
<nav><button data-t="m" class="on">O'yinlar</button><button data-t="t">Jadval</button></nav>
<script>
// GITHUB_USER ni o'zingizniki bilan almashtiring
const RAW="https://raw.githubusercontent.com/jasurumirov0622-ux/futbolchi-app/main/data.json";
const LG={PL:"Angliya",PD:"La Liga",SA:"Serie A",BL1:"Bundesliga",FL1:"Liga 1",CL:"Chempionlar ligasi"};
let D={matches:[],tables:{}},tab="m",day=0,lg="PD";
const $=s=>document.querySelector(s);
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const img=u=>u?`<img src="${u}" alt="" loading="lazy">`:"";
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function chips(){
  const list=tab==="m"?[["-1","Kecha"],["0","Bugun"],["1","Ertaga"]]:Object.entries(LG);
  const cur=tab==="m"?String(day):lg;
  $("#chips").innerHTML=list.map(([k,v])=>`<button class="chip ${k===cur?"on":""}" data-k="${k}">${v}</button>`).join("");
}
function matches(){
  const key=new Date(Date.now()+day*864e5).toLocaleDateString("sv");
  const ms=D.matches.filter(m=>new Date(m.utc).toLocaleDateString("sv")===key).sort((a,b)=>a.utc<b.utc?-1:1);
  if(!ms.length){
    const up=D.matches.filter(m=>new Date(m.utc)>new Date()&&m.st!=="FINISHED").sort((a,b)=>a.utc<b.utc?-1:1).slice(0,10);
    if(!up.length)return `<div class="empty">Bu kunda o'yinlar yo'q</div>`;
    return `<div class="empty">Bu kunda o'yinlar yo'q. Eng yaqin o'yinlar:</div>`+cards(up,true);
  }
  return cards(ms,false);
}
function cards(ms,dt){
  let comp="",h="";
  for(const m of ms){
    if(m.comp!==comp){comp=m.comp;h+=`<h3>${esc(comp)}</h3>`;}
    const live=m.st==="IN_PLAY"||m.st==="PAUSED",done=m.st==="FINISHED";
    const time=new Date(m.utc).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});
    const mid=live||done?`<div class="c ${live?"live":""}">${m.hs??0} : ${m.as??0}<small>${live?"JONLI":"Tugadi"}</small></div>`:`<div class="c">${time}${dt?`<small>${new Date(m.utc).toLocaleDateString("ru",{day:"2-digit",month:"2-digit"})}</small>`:""}</div>`;
    h+=`<div class="m"><div class="t">${img(m.hc)}<b>${esc(m.h)}</b></div>${mid}<div class="t r"><b>${esc(m.a)}</b>${img(m.ac)}</div></div>`;
  }
  return h;
}
function table(){
  const t=D.tables[lg];if(!t)return `<div class="empty">Jadval hali tayyor emas</div>`;
  return `<div class="row h"><span>#</span><span>Jamoa</span><span>O</span><span>+/-</span><span>Ochko</span></div>`+
    t.map(r=>`<div class="row"><span>${r.pos}</span><div class="n">${img(r.c)}<span>${esc(r.n)}</span></div><span>${r.p}</span><span>${r.gd}</span><b>${r.pts}</b></div>`).join("");
}
function render(){chips();$("#out").innerHTML=tab==="m"?matches():table();}
async function load(){
  try{const r=await fetch(RAW+"?t="+Math.floor(Date.now()/60000));D=await r.json();}catch(e){$("#out").innerHTML=`<div class="empty">Ma'lumot yuklanmadi. Qayta urinib ko'ring.</div>`;return;}
  render();
}
$("#chips").onclick=e=>{const k=e.target.dataset.k;if(k===undefined)return;tab==="m"?day=+k:lg=k;render();};
document.querySelector("nav").onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));render();};
load();setInterval(load,60000);
</script>
</body>
</html>

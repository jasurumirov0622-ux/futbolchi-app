<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONSPORTS.UZ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b1220;--card:#131c30;--line:#22304d;--tx:#eef2fa;--mu:#8a98b5;--ac:#2fd08a;--live:#ff5a5f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:76px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 6px;font-size:22px;font-weight:800}
header span{color:var(--ac)}
header button{background:none;border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:5px 12px;font:600 13px system-ui}
.chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.chip{border:1px solid var(--line);background:none;color:var(--mu);padding:7px 14px;border-radius:99px;font:inherit;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#052015;font-weight:700}
h3{margin:16px 16px 6px;font-size:14px;color:var(--mu);font-weight:600}
.m{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:8px;background:var(--card);margin:6px 16px;padding:12px;border-radius:14px}
.t{display:flex;align-items:center;gap:8px;min-width:0}
.t.r{justify-content:flex-end;text-align:right}
img{width:22px;height:22px;object-fit:contain;flex:none}
.t b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.c{text-align:center;font-size:18px;font-weight:800}
.c small{display:block;font-size:11px;font-weight:600;color:var(--mu)}
.c.live{color:var(--live)}
.row{display:grid;grid-template-columns:24px 1fr 28px 34px 34px;align-items:center;gap:8px;margin:0 16px;padding:9px 0;border-bottom:1px solid var(--line)}
.row.h{color:var(--mu);font-size:12px}
.row .n{display:flex;align-items:center;gap:8px;min-width:0}
.row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>*:nth-child(n+3){text-align:right}
.empty{text-align:center;color:var(--mu);padding:40px 16px}
.news{display:block;margin:6px 16px;padding:12px;background:var(--card);border-radius:14px;color:var(--tx);text-decoration:none}
.news small{display:block;color:var(--mu);margin-top:4px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px}
.grid button{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:600 14px system-ui;text-align:left}
.q{display:block;width:calc(100% - 32px);margin:8px 16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:15px system-ui}
.grid button img{width:26px;height:auto}
.skip{display:block;margin:16px auto;background:none;border:0;color:var(--mu);font:600 14px system-ui}
.paper{margin:8px 16px;font-family:Georgia,'Times New Roman',serif}
.mast{text-align:center;border-top:3px double var(--tx);border-bottom:1px solid var(--tx);padding:8px 0;margin-bottom:12px}
.mast b{display:block;font-size:21px;letter-spacing:1px;font-weight:900}
.mast small{color:var(--mu);font:12px Georgia,serif}
.paper a{color:var(--tx);text-decoration:none;display:block}
.paper img.ph{width:100%;height:auto;max-height:220px;object-fit:cover;border-radius:4px;margin-bottom:8px}
.lead{padding-bottom:12px;border-bottom:1px solid var(--line)}
.lead h2{margin:0 0 6px;font-size:22px;line-height:1.2}
.paper p{margin:0;color:#c5cee0;font-size:14px;line-height:1.45}
.paper small{color:var(--mu);font-size:12px}
.cols{columns:2;column-gap:14px;column-rule:1px solid var(--line)}
.art{break-inside:avoid;padding:12px 0;border-bottom:1px solid var(--line)}
.art h4{margin:0 0 4px;font-size:15px;line-height:1.25}
.art p{font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0f1729;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:14px 4px;font:600 13px system-ui}
nav button.on{color:var(--ac)}
#ov{position:fixed;inset:0;background:var(--bg);overflow:auto;padding-bottom:40px;display:none;z-index:5}
#ov.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:0;background:var(--bg)}
.top button{background:none;border:0;color:var(--ac);font:700 15px system-ui}
.big{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;padding:10px 16px 18px}
.big img{width:44px;height:44px;margin:0 auto 6px;display:block}
.big .s{font-size:32px;font-weight:800}
.ev{display:flex;gap:10px;margin:0 16px;padding:8px 0;border-bottom:1px solid var(--line)}
.ev i{color:var(--mu);font-style:normal;width:34px;flex:none}
.pick{display:grid;place-items:center;min-height:80vh;gap:14px;padding:16px;align-content:center}
.pick button{width:240px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:700 16px system-ui}
</style></head>
<body>
<header><div><span>ONSPORTS</span>.UZ</div><button id="lb">🌐</button></header>
<div id="chips" class="chips"></div>
<main id="out"></main>
<nav><button data-t="h"></button><button data-t="w"></button><button data-t="m"></button><button data-t="c"></button></nav>
<div id="ov"></div>
<script>
const BOT="onsportsuz_bot";
const RAW="https://raw.githubusercontent.com/jasurumirov0622-ux/futbolchi-app/main/data.json";
const LG={PL:"Premier League",PD:"La Liga",SA:"Serie A",BL1:"Bundesliga",FL1:"Ligue 1",CL:"Champions League"};
const I={
uz:{nc:"Bu davlat klublari topilmadi",ct:"Sevimli davlatingizni tanlang",cl:"Sevimli klubingizni tanlang",sub:"🔔 Xabarnomani yoqish",skip:"O'tkazib yuborish",subh:"Jamoangiz o'ynaydigan kuni sizga xabar yuboramiz. Tugmani bosib botda tasdiqlang.",nx:"Kelgusi 5 ta o'yin",lt:"Oxirgi 5 ta o'yin",w:"Yangiliklar",nn:"Hozircha yangilik yo'q",h:"Bosh sahifa",m:"O'yinlar",c:"Musobaqalar",y:"Kecha",t:"Bugun",n:"Ertaga",news:"Futbol yangiliklari",live:"JONLI",ft:"Tugadi",none:"Bu kunda o'yinlar yo'q",soon:"Eng yaqin o'yinlar",load:"Yuklanmoqda…",err:"Ma'lumot yuklanmadi",x:"Yopish",goals:"Gollar",cards:"Kartochkalar",nodet:"Tafsilotlar hali yo'q",fix:"Jamoa o'yinlari",pick:"Tilni tanlang",nt:"Jadval hali tayyor emas",tm:"Jamoa",pt:"Ochko",og:"Avtogol",pen:"Penalti"},
ru:{nc:"Клубы этой страны не найдены",ct:"Выберите любимую страну",cl:"Выберите любимый клуб",sub:"🔔 Включить уведомления",skip:"Пропустить",subh:"В день матча мы пришлём вам уведомление. Нажмите кнопку и подтвердите в боте.",nx:"Следующие 5 матчей",lt:"Последние 5 матчей",w:"Новости",nn:"Пока новостей нет",h:"Главная",m:"Матчи",c:"Турниры",y:"Вчера",t:"Сегодня",n:"Завтра",news:"Футбольные новости",live:"LIVE",ft:"Завершён",none:"В этот день матчей нет",soon:"Ближайшие матчи",load:"Загрузка…",err:"Не удалось загрузить данные",x:"Закрыть",goals:"Голы",cards:"Карточки",nodet:"Подробностей пока нет",fix:"Матчи команды",pick:"Выберите язык",nt:"Таблица пока не готова",tm:"Команда",pt:"Очки",og:"Автогол",pen:"Пенальти"},
en:{nc:"No clubs found for this country",ct:"Choose your favourite country",cl:"Choose your favourite club",sub:"🔔 Turn on notifications",skip:"Skip",subh:"We'll message you on match day. Tap the button and confirm in the bot.",nx:"Next 5 matches",lt:"Last 5 matches",w:"News",nn:"No news yet",h:"Home",m:"Matches",c:"Competitions",y:"Yesterday",t:"Today",n:"Tomorrow",news:"Football news",live:"LIVE",ft:"FT",none:"No matches on this day",soon:"Upcoming matches",load:"Loading…",err:"Failed to load data",x:"Close",goals:"Goals",cards:"Cards",nodet:"No details yet",fix:"Team matches",pick:"Choose language",nt:"Table not ready yet",tm:"Team",pt:"Pts",og:"Own goal",pen:"Penalty"}};
const CC="AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR BN BG BF BI KH CM CA CV CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY HT HN HK HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KP KR XK KW KG LA LV LB LS LR LY LI LT LU MG MW MY MV ML MT MR MU MX MD MC MN ME MA MZ MM NA NP NL NZ NI NE NG MK NO OM PK PS PA PG PY PE PH PL PT QA RO RU RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA SS ES LK SD SR SE CH SY TW TJ TZ TH TL TG TO TT TN TR TM UG UA AE GB US UY UZ VU VE VN YE ZM ZW".split(" ");
const FDC={GB:"PL",ES:"PD",IT:"SA",DE:"BL1",FR:"FL1"};
const ENO={TR:"Turkey",CZ:"Czech Republic",CI:"Ivory Coast"};
const dn=l=>{try{return new Intl.DisplayNames([l],{type:"region"})}catch(e){return new Intl.DisplayNames(["en"],{type:"region"})}};
const flag=c=>`<img src="https://flagcdn.com/w40/${c.toLowerCase()}.png" alt="">`;
function fq(v){v=v.toLowerCase();document.querySelectorAll("#cg button").forEach(b=>b.style.display=b.dataset.nm.toLowerCase().includes(v)?"":"none");}
const NAMES={uz:"🇺🇿 O'zbekcha",ru:"🇷🇺 Русский",en:"🇬🇧 English"};
let D={matches:[],tables:{},news:[],detail:{}},tab="h",day=0,lg="PD",L=null,fav=null,ob={s:"c",code:null,list:null};
const $=s=>document.querySelector(s);
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const st=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
const T=k=>I[L][k];
const img=u=>u?`<img src="${u}" alt="" loading="lazy">`:"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tm=u=>new Date(u).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});

function pickLang(){
  $("#chips").innerHTML="";$("nav").style.display="none";
  $("#out").innerHTML=`<div class="pick"><h3 style="margin:0;font-size:18px;color:var(--tx)">🌐 Til · Язык · Language</h3>`+
    Object.keys(NAMES).map(k=>`<button data-l="${k}">${NAMES[k]}</button>`).join("")+`</div>`;
}
async function loadClubs(code){
  ob.list=null;if(FDC[code])return;
  try{const en=ENO[code]||dn("en").of(code);
    const r=await fetch(`https://www.thesportsdb.com/api/v1/json/3/search_all_teams.php?s=Soccer&c=${encodeURIComponent(en)}`);
    const d=await r.json();
    ob.list=(d.teams||[]).map(t=>({id:"db"+t.idTeam,n:t.strTeam,c:t.strBadge?t.strBadge+"/tiny":""}));
  }catch(e){ob.list=[];}
  if(ob.s==="k")onboard();
}
function clubList(){
  if(FDC[ob.code]){const t=D.tables[FDC[ob.code]];return t?t.map(r=>({id:r.id,n:r.n,c:r.c})):null;}
  return ob.list;
}
function onboard(){
  $("#chips").innerHTML="";$("nav").style.display="none";let h;
  if(ob.s==="c"){const d=dn(L),nm=k=>d.of(k)||k;
    h=`<h3 style="font-size:18px;color:var(--tx)">${T("ct")}</h3><input class="q" placeholder="🔍" oninput="fq(this.value)"><div class="grid" id="cg">`+[...CC].sort((a,b)=>nm(a).localeCompare(nm(b),L)).map(k=>`<button data-c="${k}" data-nm="${esc(nm(k))}">${flag(k)}<span>${esc(nm(k))}</span></button>`).join("")+`</div><button class="skip" data-skip>${T("skip")}</button>`;}
  else if(ob.s==="k"){const l=clubList();
    h=`<h3 style="font-size:18px;color:var(--tx)">${T("cl")}</h3>`+(l===null?`<div class="empty">${T("load")}</div>`:l.length?`<div class="grid">`+[...l].sort((a,b)=>a.n.localeCompare(b.n)).map(r=>`<button data-club="${r.id}" data-n="${esc(r.n)}">${img(r.c)}<span>${esc(r.n)}</span></button>`).join("")+`</div>`:`<div class="empty">${T("nc")}</div>`)+`<button class="skip" data-back>←</button>`;}
  else h=`<div class="pick"><div style="font-size:20px;font-weight:800">⭐ ${esc(fav.n)}</div><p style="color:var(--mu);text-align:center;max-width:290px;margin:0">${T("subh")}</p><button data-sub>${T("sub")}</button><button class="skip" data-skip>${T("skip")}</button></div>`;
  $("#out").innerHTML=h;
}
function chips(){
  let list,cur;
  if(tab==="m"){list=[["-1",T("y")],["0",T("t")],["1",T("n")]];cur=String(day);}
  else if(tab==="c"){list=Object.entries(LG);cur=lg;}
  else{$("#chips").innerHTML="";return;}
  $("#chips").innerHTML=list.map(([k,v])=>`<button class="chip ${k===cur?"on":""}" data-k="${k}">${v}</button>`).join("");
}
function cards(ms,dt){
  let comp="",h="";
  for(const m of ms){
    if(m.comp!==comp){comp=m.comp;h+=`<h3>${esc(comp)}</h3>`;}
    const live=m.st==="IN_PLAY"||m.st==="PAUSED",done=m.st==="FINISHED";
    const mid=live||done?`<div class="c ${live?"live":""}">${m.hs??0} : ${m.as??0}<small>${live?T("live"):T("ft")}</small></div>`
      :`<div class="c">${tm(m.utc)}${dt?`<small>${new Date(m.utc).toLocaleDateString("ru",{day:"2-digit",month:"2-digit"})}</small>`:""}</div>`;
    h+=`<div class="m" data-mid="${m.id}"><div class="t" data-tid="${m.hid}">${img(m.hc)}<b>${esc(m.h)}</b></div>${mid}<div class="t r" data-tid="${m.aid}"><b>${esc(m.a)}</b>${img(m.ac)}</div></div>`;
  }
  return h;
}
const dayMs=d=>{const key=new Date(Date.now()+d*864e5).toLocaleDateString("sv");
  return D.matches.filter(m=>new Date(m.utc).toLocaleDateString("sv")===key).sort((a,b)=>a.utc<b.utc?-1:1);};
function matches(){
  const ms=dayMs(day);if(ms.length)return cards(ms,false);
  const up=D.matches.filter(m=>new Date(m.utc)>new Date()&&m.st!=="FINISHED").sort((a,b)=>a.utc<b.utc?-1:1).slice(0,10);
  return up.length?`<div class="empty">${T("none")}. ${T("soon")}:</div>`+cards(up,true):`<div class="empty">${T("none")}</div>`;
}
function newsHtml(n){
  const a=(D.news||[]).slice(0,n);
  if(!a.length)return `<div class="empty">${T("nn")}</div>`;
  const dt=x=>x.date?new Date(x.date).toLocaleDateString("ru"):"";
  const f=a[0];
  const lead=`<a class="lead" href="${esc(f.link)}" target="_blank" rel="noopener">${f.img?`<img class="ph" src="${esc(f.img)}" alt="" loading="lazy">`:""}<h2>${esc(f.title)}</h2><p>${esc(f.text)}</p><small>${dt(f)}</small></a>`;
  const rest=a.slice(1).map(x=>`<a class="art" href="${esc(x.link)}" target="_blank" rel="noopener">${x.img?`<img class="ph" src="${esc(x.img)}" alt="" loading="lazy">`:""}<h4>${esc(x.title)}</h4><p>${esc(x.text.slice(0,110))}</p><small>${dt(x)}</small></a>`).join("");
  return `<div class="paper"><div class="mast"><b>ONSPORTS.UZ GAZETA</b><small>${new Date().toLocaleDateString("ru",{day:"numeric",month:"long",year:"numeric"})}</small></div>${lead}<div class="cols">${rest}</div></div>`;
}
function home(){
  const live=D.matches.filter(m=>m.st==="IN_PLAY"||m.st==="PAUSED");
  const td=dayMs(0);
  let h=live.length?`<h3>🔴 ${T("live")}</h3>`+cards(live,false):"";
  const up=D.matches.filter(m=>new Date(m.utc)>new Date()&&m.st!=="FINISHED").sort((a,b)=>a.utc<b.utc?-1:1).slice(0,8);
  h+=`<h3>${T("t")}</h3>`+(td.length?cards(td,false):`<div class="empty">${T("none")}</div>`+(up.length?`<h3>${T("soon")}</h3>`+cards(up,true):""));
  return h+`<h3>📰 ${T("news")}</h3>`+newsHtml(5);
}
function tableRows(rows,hl){
  return `<div class="row h"><span>#</span><span>${T("tm")}</span><span>O</span><span>+/-</span><span>${T("pt")}</span></div>`+
   rows.map(r=>`<div class="row" ${r.id===hl?'style="color:var(--ac)"':""} data-tid="${r.id}"><span>${r.pos}</span><div class="n">${img(r.c)}<span>${esc(r.n)}</span></div><span>${r.p}</span><span>${r.gd}</span><b>${r.pts}</b></div>`).join("");
}
function comps(){const t=D.tables[lg];return t?tableRows(t):`<div class="empty">${T("nt")}</div>`;}
function render(){
  if(!L)return pickLang();
  if(ob.s!=="done")return onboard();
  $("nav").style.display="flex";
  document.querySelectorAll("nav button").forEach(b=>{b.textContent=T(b.dataset.t);b.classList.toggle("on",b.dataset.t===tab);});
  chips();$("#out").innerHTML=tab==="h"?home():tab==="w"?newsHtml(30):tab==="m"?matches():comps();
}
function openMatch(id){
  const m=D.matches.find(x=>x.id==id);if(!m)return;
  const d=(D.detail||{})[id],live=m.st==="IN_PLAY"||m.st==="PAUSED",done=m.st==="FINISHED";
  const side=t=>t===m.hid?m.h:m.a;
  let h=`<div class="top"><b>${esc(m.comp)}</b><button data-close>${T("x")}</button></div>
  <div class="big"><div data-tid="${m.hid}">${img(m.hc)}<b>${esc(m.h)}</b></div>
  <div class="s ${live?"c live":""}">${live||done?`${m.hs??0} : ${m.as??0}`:tm(m.utc)}<small style="display:block;font-size:12px;color:var(--mu)">${live?T("live"):done?T("ft"):""}</small></div>
  <div data-tid="${m.aid}">${img(m.ac)}<b>${esc(m.a)}</b></div></div>`;
  if(d&&d.g&&d.g.length)h+=`<h3>⚽ ${T("goals")}</h3>`+d.g.map(g=>`<div class="ev"><i>${g.min}'</i><span>${esc(g.n)}${g.t==="OWN"?" ("+T("og")+")":g.t==="PENALTY"?" ("+T("pen")+")":""} — ${esc(side(g.tid))}</span></div>`).join("");
  if(d&&d.c&&d.c.length)h+=`<h3>🟨 ${T("cards")}</h3>`+d.c.map(c=>`<div class="ev"><i>${c.min}'</i><span>${c.k==="RED"||c.k==="YELLOW_RED"?"🟥":"🟨"} ${esc(c.n)} — ${esc(side(c.tid))}</span></div>`).join("");
  if(!d||(!(d.g||[]).length&&!(d.c||[]).length))h+=`<div class="empty">${T("nodet")}</div>`;
  ov(h);
}
function openTeam(id){
  id=+id;
  const M=x=>Object.assign({},(D.tm||{})[x],D.matches.find(y=>y.id==x)||{});
  const tt=(D.tt||{})[id];let nx,lt;
  if(tt){nx=tt.n.map(M);lt=tt.l.map(M);}
  else{const a=D.matches.filter(m=>m.hid===id||m.aid===id).sort((p,q)=>p.utc<q.utc?-1:1);
    nx=a.filter(m=>m.st!=="FINISHED").slice(0,5);lt=a.filter(m=>m.st==="FINISHED").reverse().slice(0,5);}
  let name="",crest="";
  nx.concat(lt).forEach(m=>{if(m.hid===id){name=m.h;crest=m.hc}else if(m.aid===id){name=m.a;crest=m.ac}});
  let h=`<div class="top"><b>${esc(name)}</b><button data-close>${T("x")}</button></div>
  <div class="big" style="grid-template-columns:1fr">${crest?`<div><img src="${esc(crest)}" style="width:64px;height:64px;margin:0 auto 8px;display:block" alt=""><b style="font-size:20px">${esc(name)}</b></div>`:""}</div>`;
  h+=`<h3>${T("nx")}</h3>`+(nx.length?cards(nx,true):`<div class="empty">${T("none")}</div>`);
  h+=`<h3>${T("lt")}</h3>`+(lt.length?cards(lt,true):`<div class="empty">${T("none")}</div>`);
  ov(h);
}
function ov(h){const o=$("#ov");o.innerHTML=h;o.classList.add("on");o.scrollTop=0;}
document.body.onclick=e=>{
  const t=e.target;
  if(t.closest("[data-close]")){$("#ov").classList.remove("on");return;}
  const l=t.closest("[data-l]");if(l){L=l.dataset.l;st("lang",L);render();return;}
  if(t.closest("#lb")){L=null;fav=null;st("fav","");st("skip","");ob.s="c";render();return;}
  const oc=t.closest("[data-c]");if(oc){ob.code=oc.dataset.c;ob.s="k";loadClubs(ob.code);render();return;}
  const ok=t.closest("[data-club]");if(ok){fav={c:ob.code,id:ok.dataset.club,n:ok.dataset.n};st("fav",JSON.stringify(fav));ob.s="s";render();return;}
  if(t.closest("[data-back]")){ob.s="c";render();return;}
  if(t.closest("[data-skip]")){ob.s="done";st("skip","1");render();return;}

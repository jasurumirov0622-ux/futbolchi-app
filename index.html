.chip.on{background:var(--ac);border-color:var(--ac);color:#052015;font-weight:700}

.big2 b{display:block;margin-top:8px}.big2 .cr{width:76px;height:76px}.big2 .cr img{width:48px;height:48px}.big2 .sc{font-size:40px}
.seg2{display:flex;gap:6px;margin:8px 16px;padding:5px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.seg2 button{flex:1;padding:10px;border:0;border-radius:10px;background:none;color:var(--mu);font:700 14px system-ui}

const CC="AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR BN BG BF BI KH CM CA CV CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY HT HN HK HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KP KR XK KW KG LA LV LB LS LR LY LI LT LU MG MW MY MV ML MT MR MU MX MD MC MN ME MA MZ MM NA NP NL NZ NI NE NG MK NO OM PK PS PA PG PY PE PH PL PT QA RO RU RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA SS ES LK SD SR SE CH SY TW TJ TZ TH TL TG TO TT TN TR TM UG UA AE GB US UY UZ VU VE VN YE ZM ZW".split(" ");

const dn=l=>{try{return new Intl.DisplayNames([l],{type:"region"})}catch(e){return new Intl.DisplayNames(["en"],{type:"region"})}};
const flag=c=>`<img src="https://flagcdn.com/w40/${c.toLowerCase()}.png" alt="">`;
function fq(v){v=v.toLowerCase();document.querySelectorAll("#cg button").forEach(b=>b.style.display=b.dataset.nm.toLowerCase().includes(v)?"":"none");}
const NAMES={uz:"🇺🇿 O'zbekcha",ru:"🇷🇺 Русский",en:"🇬🇧 English"};

function pickLang(){
  $("#chips").innerHTML="";$("nav").style.display="none";
  $("#out").innerHTML=`<div class="pick"><h3 style="margin:0;font-size:18px;color:var(--tx)">🌐 Til · Язык · Language</h3>`+

function tl(n){
  if(!n||!/[A-Za-z]/.test(n))return n;
  const M=[["sch","щ"],["sh","ш"],["ch","ч"],["zh","ж"],["kh","х"],["ts","ц"],["ya","я"],["yu","ю"],["yo","ё"],["ph","ф"],["th","т"],["ck","к"],["ee","и"],["oo","у"],["ou","у"],["qu","кв"]];
  const S={a:"а",b:"б",c:"к",d:"д",e:"е",f:"ф",g:"г",h:"х",i:"и",j:"дж",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",q:"к",r:"р",s:"с",t:"т",u:"у",v:"в",w:"в",x:"кс",y:"и",z:"з"};
  return n.split(/(\s+|-)/).map(w=>{
    if(!/[A-Za-z]/.test(w))return w;
    const lw=w.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    let r=TD[lw];
    if(!r){r="";for(let i=0;i<lw.length;){const m=M.find(([k])=>lw.startsWith(k,i));
      if(m){r+=m[1];i+=m[0].length;continue;}
      const c=lw[i];r+=c==="c"&&/[eiy]/.test(lw[i+1]||"")?"с":(S[c]??c);i++;}}
    return /^[A-Z]{2,3}$/.test(w)?r.toUpperCase():r.charAt(0).toUpperCase()+r.slice(1);
  }).join("");
}
const tn=n=>L==="ru"?tl(n):n;

  ob.list=null;if(FDC[code])return;

const ICON={

function eta(u){const ms=new Date(u)-Date.now();if(ms<=0)return"";const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5),mi=Math.max(1,Math.floor(ms/6e4));
  const [n,k]=d>=1?[d,"d"]:h>=1?[h,"h"]:[mi,"m"];
  return L==="uz"?`${n} ${{d:"kun",h:"soat",m:"daqiqa"}[k]}dan so'ng`:L==="ru"?`через ${n} ${{d:"дн.",h:"ч.",m:"мин."}[k]}`:`in ${n}${k}`;}
function ago(d){if(!d)return"";const m=Math.max(1,Math.round((Date.now()-new Date(d))/6e4));
  const [n,k]=m<60?[m,"m"]:m<1440?[Math.round(m/60),"h"]:[Math.round(m/1440),"d"];
  return L==="uz"?`${n} ${{m:"daq",h:"soat",d:"kun"}[k]} oldin`:L==="ru"?`${n} ${{m:"мин",h:"ч",d:"дн"}[k]} назад`:`${n}${k} ago`;}
function chips(){
  const el=$("#chips");if(tab!=="m"){el.innerHTML="";el.className="chips";return;}
  el.className="chips seg";
  el.innerHTML=[["-1",T("y")],["0",T("t")],["1",T("n")]].map(([k,v])=>`<button class="chip ${k===String(day)?"on":""}" data-k="${k}">${v}</button>`).join("");
}
function cards(ms,dt){
  let comp=null,h="";
  for(const m of ms){
    if(m.comp!==comp){if(comp!==null)h+="</div>";comp=m.comp;h+=`<div class="lg"><div class="lgh"><b>${esc(comp)}</b></div>`;}
    const live=m.st==="IN_PLAY"||m.st==="PAUSED",done=m.st==="FINISHED";
    const mid=live||done?`<div class="c ${live?"live":""}">${m.hs??0} : ${m.as??0}<small>${live?T("live"):T("ft")}</small></div>`
      :`<div class="c">${tm(m.utc)}${dt?`<small>${new Date(m.utc).toLocaleDateString("ru",{day:"2-digit",month:"2-digit"})}</small>`:""}</div>`;
    h+=`<div class="m" data-mid="${m.id}"><div class="t" data-tid="${m.hid}">${img(m.hc)}<b>${esc(m.h)}</b></div>${mid}<div class="t r" data-tid="${m.aid}"><b>${esc(m.a)}</b>${img(m.ac)}</div></div>`;
  }
  return h+(comp!==null?"</div>":"");
}
const dayMs=d=>{const key=new Date(Date.now()+d*864e5).toLocaleDateString("sv");
  return D.matches.filter(m=>new Date(m.utc).toLocaleDateString("sv")===key).sort((a,b)=>a.utc<b.utc?-1:1);};
function matches(){
  const all=dayMs(day);
  if(!all.length){
    const up=D.matches.filter(m=>new Date(m.utc)>new Date()&&m.st!=="FINISHED").sort((a,b)=>a.utc<b.utc?-1:1).slice(0,10);
    return up.length?`<div class="empty">${T("none")}. ${T("soon")}:</div>`+cards(up,true):`<div class="empty">${T("none")}</div>`;
  }
  const cs=[...new Set(all.map(m=>m.comp))];if(cf!=="*"&&!cs.includes(cf))cf="*";
  const ms=cf==="*"?all:all.filter(m=>m.comp===cf);
  return `<div class="chips"><button class="chip ${cf==="*"?"on":""}" data-cf="*">${T("all")}<i>${all.length}</i></button>`+cs.map(c=>`<button class="chip ${c===cf?"on":""}" data-cf="${esc(c)}">${esc(c)}<i>${all.filter(m=>m.comp===c).length}</i></button>`).join("")+`</div>`+cards(ms,false);
}
function newsHtml(n,hero){
  const a=(D.news||[]).slice(0,n);
  let h=hero?`<h2 class="pt">${T("w")}<small>ONSPORTS.UZ GAZETA</small></h2>`:"";
  if(!a.length)return h+`<div class="empty">${T("nn")}</div>`;
  let rest=a;
  if(hero&&a[0].img){const f=a[0];rest=a.slice(1);
    h+=`<a class="hero" href="${esc(f.link)}" target="_blank" rel="noopener"><img src="${esc(f.img)}" alt=""><div class="ov"><small><b>ONSPORTS.UZ</b> ${ago(f.date)}</small><h2>${esc(f.title)}</h2></div></a>`;}
  return h+`<div class="card">`+rest.map(x=>`<a class="nr" href="${esc(x.link)}" target="_blank" rel="noopener"><div><small><b>ONSPORTS.UZ</b> ${ago(x.date)}</small><h4>${esc(x.title)}</h4></div>${x.img?`<img class="th" src="${esc(x.img)}" alt="" loading="lazy">`:""}</a>`).join("")+`</div>`;
}
function homeHero(){
  if(!fav)return"";
  const id=fav.id,tt=(D.tt||{})[id];
  const M=x=>Object.assign({},(D.tm||{})[x],D.matches.find(y=>y.id==x)||{});
  if(!tt||!tt.n.length)return `<div class="hero2"><div class="hh"><span class="pill">${T("yc")}</span></div><h2 style="margin:12px 0 0">⭐ ${esc(fav.n)}</h2></div>`;
  const m=M(tt.n[0]),live=m.st==="IN_PLAY"||m.st==="PAUSED";
  const f=x=>{const a=x.hid==id?x.hs:x.as,b=x.hid==id?x.as:x.hs;return a>b?"w":a<b?"l":"d"};
  const dots=tt.l.map(M).reverse().map(x=>`<i class="dot ${f(x)}"></i>`).join("");
  return `<div class="hero2" data-mid="${m.id}"><div class="hh"><span class="pill">${T("yc")}</span><span>${live?T("live"):eta(m.utc)}</span></div>
  <div class="hm"><div data-tid="${m.hid}"><span class="cr">${img(m.hc)}</span><b>${esc(m.h)}</b></div>
  <div class="sc">${live?`${m.hs??0} : ${m.as??0}`:tm(m.utc)}<small>${new Date(m.utc).toLocaleDateString(L,{weekday:"short",day:"numeric",month:"short"})}</small></div>
  <div data-tid="${m.aid}"><span class="cr">${img(m.ac)}</span><b>${esc(m.a)}</b></div></div><div class="form">${dots}</div></div>`;
}
function home(){
  const live=D.matches.filter(m=>m.st==="IN_PLAY"||m.st==="PAUSED");
  const td=dayMs(0);
  const up=D.matches.filter(m=>new Date(m.utc)>new Date()&&m.st!=="FINISHED").sort((a,b)=>a.utc<b.utc?-1:1).slice(0,8);
  let h=homeHero();
  h+=live.length?`<h3>🔴 ${T("live")}</h3>`+cards(live,false):"";
  h+=`<h3>${T("t")}</h3>`+(td.length?cards(td,false):`<div class="empty">${T("none")}</div>`+(up.length?`<h3>${T("soon")}</h3>`+cards(up,true):""));
  return h+`<h3>📰 ${T("news")}</h3>`+newsHtml(5,false);
}
function tableRows(rows,hl){
  return `<div class="row h"><span>#</span><span>${T("tm")}</span><span>O</span><span>+/-</span><span>${T("pt")}</span></div>`+
   rows.map(r=>`<div class="row" ${r.id===hl?'style="color:var(--ac)"':""} data-tid="${r.id}"><span>${r.pos}</span><div class="n">${img(r.c)}<span>${esc(r.n)}</span></div><span>${r.p}</span><span>${r.gd}</span><b>${r.pts}</b></div>`).join("");
}
function comps(){
  if(lgOpen){const t=D.tables[lg];
    return `<div class="mh"><button class="ib" data-lgback>←</button><div class="ml">${LG[lg]}</div><span class="ib" style="visibility:hidden"></span></div>`+(t?`<div class="card">${tableRows(t)}</div>`:`<div class="empty">${T("nt")}</div>`);}
  return `<h2 class="pt">${T("lgs")}</h2>`+Object.keys(LG).map(k=>{
    const [f,g]=LGS[k],t=D.tables[k],r=t&&t[0];
    return `<div class="lc2" data-lg="${k}" style="background:linear-gradient(135deg,${g})"><img class="fl" src="https://flagcdn.com/w40/${f}.png" alt=""><h3>${LG[k]}</h3>`+(r?`<div class="ld"><small>${T("ld")}</small>${img(r.c)}<span>${esc(r.n)}</span><small>${r.pts} ${T("pt")}</small></div>`:"")+`</div>`;}).join("");
}
function render(){
  if(!L)return pickLang();
  if(ob.s!=="done")return onboard();
  $("nav").style.display="flex";
  $("nav").innerHTML=["h","w","m","c"].map(k=>`<button data-t="${k}" class="${k===tab?"on":""}">${ICON[k]}<span>${T(k)}</span></button>`).join("");
  chips();$("#out").innerHTML=tab==="h"?home():tab==="w"?newsHtml(30,true):tab==="m"?matches():comps();
}
let mcur=null,mtab="o";
function openMatch(id,tb){
  const m=D.matches.find(x=>x.id==id)||Object.assign({},(D.tm||{})[id]);if(!m||!m.utc)return;
  if(tb)mtab=tb;else if(id!=mcur)mtab="o";mcur=id;
  const d=(D.detail||{})[id],live=m.st==="IN_PLAY"||m.st==="PAUSED",done=m.st==="FINISHED";
  const side=t=>t===m.hid?m.h:m.a;
  let h=`<div class="mh"><button class="ib" data-close>←</button><div class="ml">${esc(m.comp)}</div><span class="ib" style="visibility:hidden"></span></div>
  <div style="text-align:center"><span class="pill">${new Date(m.utc).toLocaleDateString(L,{weekday:"short",day:"numeric",month:"short"})}</span></div>
  <div class="big2"><div data-tid="${m.hid}"><span class="cr">${img(m.hc)}</span><b>${esc(m.h)}</b></div>
  <div class="sc">${live||done?`${m.hs??0} : ${m.as??0}`:tm(m.utc)}<small class="${live?"lv":""}">${live?T("live"):done?T("ft"):eta(m.utc)}</small></div>
  <div data-tid="${m.aid}"><span class="cr">${img(m.ac)}</span><b>${esc(m.a)}</b></div></div>
  <div class="seg2">${[["o",T("ov")],["t",T("tb")],["h",T("h2")]].map(([k,v])=>`<button data-mt="${k}" class="${k===mtab?"on":""}">${v}</button>`).join("")}</div>`;
  const none=`<div class="empty">${T("nodet")}</div>`;
  if(mtab==="o"){
    const ev=[...((d&&d.g)||[]).map(g=>({min:g.min,ic:"⚽",tx:esc(g.n)+(g.t==="OWN"?" ("+T("og")+")":g.t==="PENALTY"?" ("+T("pen")+")":""),tid:g.tid})),
      ...((d&&d.c)||[]).map(c=>({min:c.min,ic:c.k==="RED"||c.k==="YELLOW_RED"?"🟥":"🟨",tx:esc(c.n),tid:c.tid}))].sort((a,b)=>(a.min||0)-(b.min||0));
    h+=ev.length?`<div class="card">`+ev.map(e=>`<div class="ev"><i>${e.min}'</i><span>${e.ic} ${e.tx} — ${esc(side(e.tid))}</span></div>`).join("")+`</div>`:none;
  }else if(mtab==="t"){
    const k=Object.keys(D.tables||{}).sort(a=>a==="CL"?1:-1).find(k=>{const t=D.tables[k];return t.some(r=>r.id===m.hid)&&t.some(r=>r.id===m.aid);});
    h+=k?`<div class="card">${tableRows(D.tables[k].filter(r=>r.id===m.hid||r.id===m.aid))}</div>`:none;
  }else{
    const all={};[...Object.values(D.tm||{}),...D.matches].forEach(x=>{if(x.st==="FINISHED"&&x.id!==m.id&&[x.hid,x.aid].includes(m.hid)&&[x.hid,x.aid].includes(m.aid))all[x.id]=x;});
    const l=Object.values(all).sort((a,b)=>a.utc<b.utc?1:-1);
    h+=l.length?cards(l,true):none;
  }
  ov(h);
}
function openTeam(id){
  id=+id;
  const M=x=>Object.assign({},(D.tm||{})[x],D.matches.find(y=>y.id==x)||{});
  const tt=(D.tt||{})[id];let nx,lt;
  if(tt){nx=tt.n.map(M);lt=tt.l.map(M);}
  else{const a=D.matches.filter(m=>m.hid===id||m.aid===id).sort((p,q)=>p.utc<q.utc?-1:1);
    nx=a.filter(m=>m.st!=="FINISHED").slice(0,5);lt=a.filter(m=>m.st==="FINISHED").reverse().slice(0,5);}
  let name="",crest="";
  nx.concat(lt).forEach(m=>{if(m.hid===id){name=m.h;crest=m.hc}else if(m.aid===id){name=m.a;crest=m.ac}});
  let h=`<div class="top"><b>${esc(name)}</b><button data-close>${T("x")}</button></div>
  <div class="big" style="grid-template-columns:1fr">${crest?`<div><img src="${esc(crest)}" style="width:64px;height:64px;margin:0 auto 8px;display:block" alt=""><b style="font-size:20px">${esc(name)}</b></div>`:""}</div>`;
  h+=`<h3>${T("nx")}</h3>`+(nx.length?cards(nx,true):`<div class="empty">${T("none")}</div>`);
  h+=`<h3>${T("lt")}</h3>`+(lt.length?cards(lt,true):`<div class="empty">${T("none")}</div>`);
  ov(h);
}
function ov(h){const o=$("#ov");o.innerHTML=h;o.classList.add("on");o.scrollTop=0;}
document.body.onclick=e=>{
  const t=e.target;
  if(t.closest("[data-close]")){$("#ov").classList.remove("on");return;}
  const l=t.closest("[data-l]");if(l){L=l.dataset.l;st("lang",L);render();load();return;}
  if(t.closest("#lb")){L=null;fav=null;st("fav","");st("skip","");ob.s="c";render();return;}
  const oc=t.closest("[data-c]");if(oc){ob.code=oc.dataset.c;ob.s="k";loadClubs(ob.code);render();return;}
  const ok=t.closest("[data-club]");if(ok){fav={c:ob.code,id:ok.dataset.club,n:ok.dataset.n};st("fav",JSON.stringify(fav));ob.s="s";render();return;}
  if(t.closest("[data-back]")){ob.s="c";render();return;}
  if(t.closest("[data-skip]")){ob.s="done";st("skip","1");render();return;}
  if(t.closest("[data-sub]")){ob.s="done";render();const lk=`https://t.me/${BOT}?start=fav_${L}_${fav.id}`;tg?tg.openTelegramLink(lk):window.open(lk,"_blank");return;}
  const cf2=t.closest("[data-cf]");if(cf2){cf=cf2.dataset.cf;render();return;}
  const lgc=t.closest("[data-lg]");if(lgc){lg=lgc.dataset.lg;lgOpen=true;render();return;}
  if(t.closest("[data-lgback]")){lgOpen=false;render();return;}
  const mt2=t.closest("[data-mt]");if(mt2){openMatch(mcur,mt2.dataset.mt);return;}
  const ch=t.closest(".chip");if(ch){tab==="m"?day=+ch.dataset.k:lg=ch.dataset.k;render();return;}
  const nb=t.closest("nav button");if(nb){tab=nb.dataset.t;lgOpen=false;$("#ov").classList.remove("on");render();return;}
  const te=t.closest("[data-tid]");if(te&&te.dataset.tid!=="null"){openTeam(te.dataset.tid);return;}
  const mt=t.closest("[data-mid]");if(mt)openMatch(mt.dataset.mid);
};
async function load(){
  try{const r=await fetch(RAW+"?t="+Math.floor(Date.now()/60000));D=await r.json();locD();}
  catch(e){if(L)$("#out").innerHTML=`<div class="empty">${T("err")}</div>`;return;}
  if(!$("#ov").classList.contains("on")&&L&&!(ob.s==="c"||(ob.s==="k"&&clubList())))render();
}
L=st("lang");
try{fav=JSON.parse(st("fav")||"null");}catch(e){}
ob.s=fav?"done":"c";
if(!L){const c=((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user||{}).language_code||"").slice(0,2);L=null;}
render();load();setInterval(load,60000);
</script></body></html>
